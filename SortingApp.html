<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>String Test</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script type="text/javascript" language="JavaScript" src="SortingApp.js"></script>
    </head>
    <body>

        <h1>Sorting String Arrays</h1>
        <p>
            Enter two or more names in the field below and the sorted list of names will appear in the text area.
        </p>
        <form name="InputForm">
            <input type="text" name="NewName" size="100">
            <input type="button" name="AddName" value="Click here to add" onclick="SortNames();">
            <h2>Sorted Names</h2>
            <textarea cols="100" rows="10" name="SortedNames">
                Sorted Names will appear here:
            </textarea>
        </form>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
